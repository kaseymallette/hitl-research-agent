<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
<title id="title">Kanbur evaluation tournament bracket</title>
<desc id="desc">Kanbur compares GPT-6.1 Sol through API, App, and Codex in Medium and High effort divisions. In each division, seed 2 App plays seed 3 Codex; the winner faces seed 1 API, which has a bye. The division champions meet in Experiment 5. Codex wins Experiments 1–4 and advances from both divisions. Codex medium defeats Codex high in Experiment 5 to become the tournament champion.</desc>

#    pdf: data/legislation/author_year_short_title.pdf
#    source_title: "..."
#    source_authors: [First Last, First Last]
#    publication_date: "YYYY-MM-DD"          # or null
#    source_type: government_policy
#    doi: null
#    publisher: null
#    url: null
#    retrieved_at: "YYYY-MM-DDTHH:MM:SS+00:00"
#    selection:                            # how and why it is in the corpus
#      how: "e.g. listed in a cross-state policy tracker"
#      why: "the criterion it meets, e.g. enacted statute that defines SoR"
#    provenance_basis:
#      source_title: where the title was taken from

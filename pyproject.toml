[project]
name = "hitl-research-agent"
version = "0.1.0"
description = "A human-in-the-loop agentic AI research system for grounded source analysis, evaluation, and evidence synthesis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pymupdf4llm==1.28.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hitl_research_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated run/preparation artifacts (including preserved one-off scripts) are data, not project code.
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["hitl_research_agent"]
mypy_path = "src"
strict = true

[tool.uv]
# onnxruntime (pulled in by pymupdf-layout) ships no recent Intel-macOS wheels; resolve for
# the platforms this project is developed and tested on so the lockfile stays installable.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

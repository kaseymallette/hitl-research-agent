# The research collection: the accepted analysis and argument evaluation for
# each article. Files are in outputs/analyses/<slug>/; the judgments are in
# outputs/judgments/<article>/judgments/, and every revision's scores in
# outputs/judgments/<article>/scores.md. An article is added here once both are
# accepted, and the claims store is built only from this list.
#
# Scores are those of the accepted version, as judged in the named judgment
# (docs/RUBRIC.md). A1 is the share of 30 sampled claims, and of their support
# items, scored 2; A2 counts list items missed or only partly caught; A3 and
# B1-B5 are out of 2; A4 counts mechanical failures. B6 counts the problems the
# evaluation raised, how many the judge confirmed in full or in part, and its
# errors about the article.


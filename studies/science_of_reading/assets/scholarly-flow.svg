<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Scholarly harness: does close reading give better answers?</title>
  <desc id="desc">Every step reads the article. Step 1 creates an independent claims reference. Method A uses step 2, baseline answers. Method B uses step 3, close reading, followed by step 4, close reading answers. The claims reference (1), baseline answers (2), and close reading answers (4) each feed step 5, scoring, which compares the two methods against the reference for recall and precision.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 1 L 9 5 L 2 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .label { font-size: 11px; letter-spacing: 1.2px; fill: #475569; }
    .name { font-size: 16px; font-weight: 600; fill: #0f172a; }
    .note { font-size: 13px; fill: #475569; }
    .number { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .connector { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#head); }
  </style>
  <rect width="1000" height="380" rx="16" fill="#f8fafc"/>
  <text x="32" y="35" class="label">SCHOLARLY HARNESS / ONE ARTICLE</text>
  <text x="968" y="35" class="label" text-anchor="end">EVERY STEP READS THE ARTICLE</text>

  <path d="M 310 108 H 740" class="connector"/>
  <path d="M 310 208 H 740" class="connector"/>
  <path d="M 310 308 H 365" class="connector"/>
  <path d="M 660 308 H 740" class="connector"/>

  <rect x="40" y="76" width="270" height="64" rx="8" fill="#ffffff" stroke="#64748b"/>
  <rect x="52" y="94" width="28" height="28" rx="5" fill="#64748b"/>
  <text x="66" y="113" class="number">1</text>
  <text x="92" y="103" class="name">Claims reference</text>
  <text x="92" y="124" class="note">Independent answer key</text>

  <rect x="40" y="176" width="270" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="52" y="194" width="28" height="28" rx="5" fill="#2563eb"/>
  <text x="66" y="213" class="number">2</text>
  <text x="92" y="203" class="name">Baseline answers</text>
  <text x="92" y="224" class="note">Method A · article alone</text>

  <rect x="40" y="276" width="270" height="64" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <rect x="52" y="294" width="28" height="28" rx="5" fill="#0f766e"/>
  <text x="66" y="313" class="number">3</text>
  <text x="92" y="303" class="name">Close reading</text>
  <text x="92" y="324" class="note">Method B · relevant passages</text>

  <rect x="365" y="276" width="295" height="64" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <rect x="377" y="294" width="28" height="28" rx="5" fill="#0f766e"/>
  <text x="391" y="313" class="number">4</text>
  <text x="417" y="303" class="name">Close reading answers</text>
  <text x="417" y="324" class="note">Method B · uses close reading</text>

  <rect x="740" y="76" width="220" height="264" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="756" y="94" width="28" height="28" rx="5" fill="#0f172a"/>
  <text x="770" y="113" class="number">5</text>
  <text x="796" y="114" class="name">Scoring</text>
  <text x="756" y="150" class="note">Method A (2) vs Method B (4),</text>
  <text x="756" y="168" class="note">against the claims reference (1)</text>
  <line x1="756" y1="192" x2="944" y2="192" stroke="#e2e8f0"/>
  <text x="756" y="226" class="name">Recall</text>
  <text x="756" y="246" class="note">Relevant claims used or missed</text>
  <text x="756" y="286" class="name">Precision</text>
  <text x="756" y="306" class="note">Quotes real, exact, relevant</text>
</svg>

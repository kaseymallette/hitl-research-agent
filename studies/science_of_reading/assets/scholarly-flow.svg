<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Scholarly harness: three calls for one article</title>
<desc id="desc">The article branches to 01, the three questions answered from the article, and 02, the close reading. Below the close reading is 03, the three questions answered from the article and the close reading.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="340" rx="16" fill="#f8fafc"/>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; } .label { font-size: 11px; letter-spacing: 1.2px; } .name { font-size: 15px; } .note { font-size: 12px; }</style>
<text x="32" y="35" fill="#64748b" class="label">SCHOLARLY HARNESS / ONE ARTICLE</text>
<text x="968" y="35" fill="#64748b" class="label" text-anchor="end">3 CODEX SESSIONS  ·  3 FILES</text>

<rect x="420" y="56" width="160" height="42" rx="6" fill="#ffffff" stroke="#0f172a"/>
<text x="500" y="82" fill="#0f172a" class="name" text-anchor="middle" font-weight="600">Article</text>

<path d="M 500 98 V 126 H 270 V 150" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M 500 126 H 730 V 150" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#head)"/>

<rect x="120" y="154" width="300" height="42" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<rect x="130" y="164" width="26" height="22" rx="4" fill="#2563eb"/>
<text x="143" y="179" fill="#ffffff" class="note" text-anchor="middle" font-weight="700">01</text>
<text x="166" y="180" fill="#0f172a" class="name" font-weight="600">Questions</text>
<text x="270" y="216" fill="#64748b" class="note" text-anchor="middle">from the article</text>

<rect x="580" y="154" width="300" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="590" y="164" width="26" height="22" rx="4" fill="#e2e8f0"/>
<text x="603" y="179" fill="#475569" class="note" text-anchor="middle" font-weight="700">02</text>
<text x="626" y="180" fill="#0f172a" class="name" font-weight="600">Close reading</text>

<path d="M 730 196 V 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/>

<rect x="580" y="244" width="300" height="42" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
<rect x="590" y="254" width="26" height="22" rx="4" fill="#0f766e"/>
<text x="603" y="269" fill="#ffffff" class="note" text-anchor="middle" font-weight="700">03</text>
<text x="626" y="270" fill="#0f172a" class="name" font-weight="600">Questions</text>
<text x="730" y="306" fill="#64748b" class="note" text-anchor="middle">from the article + close reading</text>
</svg>

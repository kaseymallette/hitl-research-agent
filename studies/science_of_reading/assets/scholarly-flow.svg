<title id="title">Scholarly harness: does close reading give better answers?</title>
<desc id="desc">The article feeds three branches: 1, the claims reference, the answer key; 2, Method A, the baseline answers from the article alone; and 3, Method B's close reading, which feeds 4, the close reading answers. 5, scoring, compares 2 and 4 against the claims reference for recall and precision.</desc>
